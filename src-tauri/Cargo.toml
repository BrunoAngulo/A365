[package]
name = "a365_indicadores"
version = "0.1.0"
description = "Dashboard operativo A365"
authors = ["A365"]
edition = "2021"

[lib]
name = "a365_indicadores_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "gzip", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
